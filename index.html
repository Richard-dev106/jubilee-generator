<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jubilee Generator</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    background:linear-gradient(135deg,#050505,#1b0033,#000);
    color:white;
}

.box{
    width:90%;
    max-width:900px;
    background:rgba(255,255,255,0.06);
    border:2px solid #9d4dff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 25px #8a2be2;
}

h1{text-align:center;color:#d9a8ff;}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

input,button{
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

input{
    width:230px;
    background:#111;
    color:white;
    border:2px solid #8a2be2;
}

button{
    background:#8a2be2;
    color:white;
    cursor:pointer;
}

button:hover{transform:scale(1.05);}

.card{
    background:rgba(255,255,255,0.06);
    border:1px solid #9d4dff;
    border-radius:15px;
    padding:15px;
    margin-top:10px;
}

small{opacity:0.75;}

.plane{
    position:fixed;
    top:50%;
    left:-120px;
    font-size:40px;
    animation:fly 3s linear forwards;
    pointer-events:none;
}

@keyframes fly{
    from{left:-120px;}
    to{left:110%;}
}
</style>
</head>

<body>

<div class="box">

<h1 id="title">🎉 Jubilee Generator</h1>

<div class="controls">

<input id="birth" placeholder="dd.mm.yyyy">

<button onclick="generate()" id="genBtn">Generate</button>
<button onclick="translatePage()" id="trBtn">Русский</button>

</div>

<div id="result"></div>

</div>

<script>

let isRussian = false;
let currentEvents = [];

/* ---------- STRICT DATE VALIDATION ---------- */
function parseDate(str){

    const p = str.split(".");
    if(p.length !== 3) return null;

    let day = Number(p[0]);
    let month = Number(p[1]);
    let year = Number(p[2]);

    if(!day || !month || !year) return null;

    if(month < 1 || month > 12) return null;
    if(day < 1 || day > 31) return null;

    let date = new Date(year, month - 1, day);

    if(
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
    ){
        return null;
    }

    if(date > new Date()) return null;

    return date;
}

/* ---------- FORMAT ---------- */
function formatDate(d){
    return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
}

/* ---------- TIME ---------- */
function addTime(date, amount, type){
    let d = new Date(date);

    if(type==="days") d.setDate(d.getDate()+amount);
    if(type==="months") d.setMonth(d.getMonth()+amount);
    if(type==="years") d.setFullYear(d.getFullYear()+amount);

    return d;
}

/* ---------- SPECIALS ---------- */
const PI = [314,3141];

const SPECIALS = [
    42,69,100,144,256,360,720,747,777,1000
];

/* ---------- PICK ---------- */
function getSpecial(type){

    let list = [...SPECIALS];

    if(type==="days") list.push(...PI);
    if(type==="months") list = list.filter(n=>n<=1000);
    if(type==="years") list = list.filter(n=>n<=150);

    if(Math.random()<0.6){
        return list[Math.floor(Math.random()*list.length)];
    }

    return null;
}

/* ---------- PLANE ---------- */
function spawnPlane(){
    const p=document.createElement("div");
    p.className="plane";
    p.innerText="✈️";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3000);
}

/* ---------- LABEL ---------- */
function label(amount,type){

    let unit =
        type==="days"
        ? (isRussian?"дней":"days")
        : type==="months"
        ? (isRussian?"месяцев":"months")
        : (isRussian?"лет":"years");

    if(isRussian){
        if(amount===747) return `747 (самолёт ✈️) ${unit}`;
        if(amount===777) return `777 (удача 🍀) ${unit}`;
        if(amount===314) return `314 (π) ${unit}`;
        if(amount===3141) return `3141 (π) ${unit}`;
        return `${amount} ${unit}`;
    }

    if(amount===747) return `747 (plane ✈️) ${unit}`;
    if(amount===777) return `777 (lucky 🍀) ${unit}`;
    if(amount===314) return `314 (pi) ${unit}`;
    if(amount===3141) return `3141 (pi) ${unit}`;

    return `${amount} ${unit}`;
}

/* ---------- NO DUPLICATES ---------- */
function buildEvents(birth){

    let used = new Set();
    let list = [];

    function unique(type){

        while(true){

            let amount = getSpecial(type);

            if(amount===null){
                if(type==="days") amount=Math.floor(Math.random()*5000)+50;
                if(type==="months") amount=Math.floor(Math.random()*1000)+1;
                if(type==="years") amount=Math.floor(Math.random()*150)+1;
            }

            let key = type+"-"+amount;

            if(!used.has(key)){
                used.add(key);
                return amount;
            }
        }
    }

    for(let i=0;i<15;i++){

        let type=["days","months","years"][Math.floor(Math.random()*3)];
        let amount = unique(type);

        list.push({
            type,
            amount,
            date:addTime(birth,amount,type)
        });
    }

    return list;
}

/* ---------- RENDER ---------- */
function render(){

    const r=document.getElementById("result");
    r.innerHTML="";

    currentEvents.forEach(e=>{

        if(e.amount===747) spawnPlane();

        const d=document.createElement("div");
        d.className="card";

        d.innerHTML=`
        <b>${label(e.amount,e.type)}</b><br>
        <small>${formatDate(e.date)}</small>
        `;

        r.appendChild(d);
    });
}

/* ---------- GENERATE ---------- */
function generate(){

    const birth=parseDate(document.getElementById("birth").value);

    if(!birth){
        alert(isRussian?"Неверная дата!":"Invalid date!");
        return;
    }

    currentEvents=buildEvents(birth);
    render();
}

/* ---------- TRANSLATE ---------- */
function translatePage(){

    isRussian=!isRussian;

    document.getElementById("title").innerText=
        isRussian?"🎉 Генератор Юбилеев":"🎉 Jubilee Generator";

    document.getElementById("genBtn").innerText=
        isRussian?"Сгенерировать":"Generate";

    document.getElementById("trBtn").innerText=
        isRussian?"English":"Русский";

    document.getElementById("birth").placeholder=
        isRussian?"дд.мм.гггг":"dd.mm.yyyy";

    if(currentEvents.length>0) render();
}

/* ---------- ENTER KEY ---------- */
document.getElementById("birth").addEventListener("keydown", e=>{
    if(e.key==="Enter") generate();
});

/* ---------- START ---------- */
window.onload=generate;

</script>

</body>
</html>
