<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jubilee Generator</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0a0a0a,#1b0033,#000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:90%;
    max-width:850px;
    background:rgba(255,255,255,0.06);
    border:2px solid #a64dff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 25px #8a2be2;
}

h1{
    text-align:center;
    color:#d9a8ff;
    margin-bottom:15px;
}

.controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input,button{
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

input{
    width:230px;
    background:#1a1a1a;
    color:white;
    border:2px solid #8a2be2;
}

button{
    background:#8a2be2;
    color:white;
    cursor:pointer;
    box-shadow:0 0 10px #8a2be2;
}

button:hover{
    transform:scale(1.05);
}

.upcoming{
    background:rgba(166,77,255,0.15);
    border:2px solid #a64dff;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    text-align:center;
}

.card{
    background:rgba(255,255,255,0.07);
    border:1px solid #a64dff;
    padding:15px;
    border-radius:15px;
    margin-top:10px;
}

small{opacity:0.7;}
</style>
</head>

<body>

<div class="box">

<h1 id="title">🎉 Jubilee Generator</h1>

<div class="controls">
    <input id="birth" placeholder="dd.mm.yyyy">
    <button onclick="generate()" id="genBtn">Generate</button>
    <button onclick="translatePage()" id="trBtn">Русский</button>
</div>

<div id="upcoming"></div>
<div id="result"></div>

</div>

<script>

let isRussian = true;

/* ---------- RANDOM ---------- */

function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

/* ---------- DATE ---------- */

function parseDate(str){

    const p = str.split(".");

    if(p.length !== 3) return null;

    return new Date(
        parseInt(p[2]),
        parseInt(p[1])-1,
        parseInt(p[0])
    );
}

function formatDate(date){

    return `${String(date.getDate()).padStart(2,"0")}.${String(date.getMonth()+1).padStart(2,"0")}.${date.getFullYear()}`;
}

/* ---------- TIME ---------- */

function addTime(date,amount,type){

    let d = new Date(date);

    if(type==="seconds") d.setSeconds(d.getSeconds()+amount);
    if(type==="minutes") d.setMinutes(d.getMinutes()+amount);
    if(type==="days") d.setDate(d.getDate()+amount);
    if(type==="months") d.setMonth(d.getMonth()+amount);
    if(type==="years") d.setFullYear(d.getFullYear()+amount);
    if(type==="decades") d.setFullYear(d.getFullYear()+(amount*10));

    return d;
}

/* ---------- TEXT ---------- */

function label(amount,type){

    if(!isRussian){
        return `${amount} ${type}`;
    }

    if(type==="seconds") return `${amount} секунд`;
    if(type==="minutes") return `${amount} минут`;
    if(type==="days") return `${amount} дней`;
    if(type==="months") return `${amount} месяцев`;
    if(type==="years") return `${amount} лет`;
    if(type==="decades") return `${amount} десятилетий`;
}

/* ---------- BUILD ALL ---------- */

function buildAllEvents(birth){

    let list = [];

    /* seconds */
    for(let i=314;i<=5000;i++){

        list.push({
            type:"seconds",
            amount:i,
            date:addTime(birth,i,"seconds")
        });
    }

    /* minutes */
    for(let i=60;i<=10000;i++){

        list.push({
            type:"minutes",
            amount:i,
            date:addTime(birth,i,"minutes")
        });
    }

    /* days */
    for(let i=7;i<=5000;i++){

        list.push({
            type:"days",
            amount:i,
            date:addTime(birth,i,"days")
        });
    }

    /* months */
    for(let i=1;i<=314;i++){

        list.push({
            type:"months",
            amount:i,
            date:addTime(birth,i,"months")
        });
    }

    /* years */
    for(let i=1;i<=150;i++){

        list.push({
            type:"years",
            amount:i,
            date:addTime(birth,i,"years")
        });
    }

    /* decades */
    for(let i=1;i<=14;i++){

        list.push({
            type:"decades",
            amount:i,
            date:addTime(birth,i,"decades")
        });
    }

    return list;
}

/* ---------- MAIN ---------- */

function generate(){

    const input = document.getElementById("birth").value;
    const result = document.getElementById("result");
    const upcoming = document.getElementById("upcoming");

    result.innerHTML = "";
    upcoming.innerHTML = "";

    const birth = parseDate(input);

    if(!birth || isNaN(birth)){
        alert("Invalid date!");
        return;
    }

    /* ENTIRE LIST */
    let events = buildAllEvents(birth);

    const now = new Date();

    /* SORT ENTIRE LIST */
    events.sort((a,b)=>a.date-b.date);

    /* TAKE FIRST FUTURE EVENT */
    const next = events.find(e => e.date > now);

    if(next){

        upcoming.innerHTML = `
        <div class="upcoming">

            <h2>
                🚀 ${
                    isRussian
                    ? "Следующий юбилей"
                    : "Next upcoming jubilee"
                }
            </h2>

            <h3>
                ${label(next.amount,next.type)}
            </h3>

            <div>
                ${formatDate(next.date)}
            </div>

        </div>
        `;
    }

    /* SHOW RANDOM 20 */
    const random20 = [...events]
        .sort(()=>Math.random()-0.5)
        .slice(0,20);

    random20.forEach(event=>{

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
        <b>
            ${label(event.amount,event.type)}
        </b>

        <br>

        <small>
            ${formatDate(event.date)}
        </small>
        `;

        result.appendChild(card);
    });
}

</script>
</body>
</html>
